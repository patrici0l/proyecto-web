<div class="toast-layer" *ngIf="visible" (click)="cerrar()" role="presentation">
    <div class="toast" [ngClass]="tipo" (click)="$event.stopPropagation()" role="alert" aria-live="assertive"
        aria-atomic="true">
        <div class="toast__icon" aria-hidden="true">
            <ng-container [ngSwitch]="tipo">
                <i *ngSwitchCase="'exito'" class="bi bi-check-circle-fill"></i>
                <i *ngSwitchCase="'error'" class="bi bi-x-circle-fill"></i>
                <i *ngSwitchDefault class="bi bi-info-circle-fill"></i>
            </ng-container>
        </div>

        <div class="toast__body">
            <div class="toast__title">
                <ng-container [ngSwitch]="tipo">
                    <span *ngSwitchCase="'exito'">Listo</span>
                    <span *ngSwitchCase="'error'">Atención</span>
                    <span *ngSwitchDefault>Información</span>
                </ng-container>
            </div>

            <div class="toast__message">{{ mensaje }}</div>
        </div>

        <button type="button" class="toast__close" (click)="cerrar()" aria-label="Cerrar notificación">
            <i class="bi bi-x-lg" aria-hidden="true"></i>
        </button>
    </div>
</div>
