<div class="proyectos-admin">

    <header class="header-section">
        <h2>
            <i class="bi bi-folder2-open"></i>
            Proyectos del programador
        </h2>
        <button class="btn-nuevo" (click)="nuevoProyecto()">
            <i class="bi bi-plus-lg"></i> Nuevo proyecto
        </button>
    </header>

    <div class="table-container" *ngIf="proyectos.length > 0; else sinProyectos">
        <table>
            <thead>
                <tr>
                    <th>Nombre</th>
                    <th>Tipo</th>
                    <th>Rol</th>
                    <th>Tecnologías</th>
                    <th class="text-end">Acciones</th>
                </tr>
            </thead>

            <tbody>
                <tr *ngFor="let p of proyectos">
                    <td data-label="Nombre">
                        <span class="proyecto-nombre">{{ p.nombre }}</span>
                    </td>
                    <td data-label="Tipo">
                        <span class="badge">{{ p.tipoProyecto }}</span>
                    </td>
                    <td data-label="Rol">{{ p.tipoParticipacion }}</td>
                    <td data-label="Tecnologías" class="text-muted">{{ p.tecnologias }}</td>
                    <td class="actions-cell">
                        <button class="btn-icon edit" (click)="editarProyecto(p.id!)" title="Editar">
                            <i class="bi bi-pencil-square"></i>
                        </button>
                        <button class="btn-icon delete" (click)="eliminarProyecto(p.id!)" title="Eliminar">
                            <i class="bi bi-trash3"></i>
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <ng-template #sinProyectos>
        <div class="empty-state">
            <i class="bi bi-journal-x"></i>
            <p>No hay proyectos registrados aún.</p>
            <small>Haz clic en "Nuevo proyecto" para comenzar.</small>
        </div>
    </ng-template>

</div>
