<div class="login-page">

  <div class="login-card">

    <div class="login-card-header">
      <div class="brand-pill">
        <span class="brand-icon">👨‍💻</span>
        <span class="brand-text">Gestión </span>
      </div>
      <app-theme-toggle></app-theme-toggle>
    </div>

    <div class="logo-orbit">
      <div class="orbit-ring"></div>
      <div class="orbit-core">
        <span>🚀</span>
      </div>
    </div>

    <h2 class="typing-text">
      {{ esModoLogin ? 'Bienvenido de nuevo' : 'Crea tu cuenta' }}
    </h2>

    <p class="descripcion">
      {{ esModoLogin ? 'Ingresa tus credenciales para acceder.' : 'Regístrate para gestionar tus proyectos.' }}
    </p>

    <form (ngSubmit)="onSubmit()" style="width: 100%; margin-top: 20px;">
      
      <div *ngIf="!esModoLogin" class="form-group" style="margin-bottom: 15px;">
        <input 
          type="text" 
          [(ngModel)]="nombre" 
          name="nombre" 
          placeholder="Nombre Completo" 
          required
          class="custom-input"
        >
      </div>

      <div class="form-group" style="margin-bottom: 15px;">
        <input 
          type="email" 
          [(ngModel)]="email" 
          name="email" 
          placeholder="Correo Electrónico" 
          required
          class="custom-input"
        >
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <input 
          type="password" 
          [(ngModel)]="password" 
          name="password" 
          placeholder="Contraseña" 
          required
          class="custom-input"
        >
      </div>

      <p *ngIf="mensajeError" style="color: #ff4444; font-size: 0.9rem; text-align: center; margin-bottom: 10px;">
        {{ mensajeError }}
      </p>

      <button type="submit" [disabled]="cargando" class="google-btn" style="justify-content: center;">
        <span class="google-text" style="margin: 0;">
          {{ cargando ? 'Procesando...' : (esModoLogin ? 'Iniciar Sesión' : 'Registrarse') }}
        </span>
        <span class="btn-glow-pulse" aria-hidden="true"></span>
      </button>

    </form>

    <p class="trust-text" style="margin-top: 20px; cursor: pointer; text-decoration: underline;" (click)="toggleModo()">
      {{ esModoLogin ? '¿No tienes cuenta? Regístrate aquí' : '¿Ya tienes cuenta? Inicia sesión' }}
    </p>

  </div>
</div>
