<app-menu></app-menu>

<div class="programador-container">

    <header class="page-head">
        <h1>Panel de Programador</h1>
        <p class="page-sub">Gestiona tus proyectos.</p>
    </header>

    <section *ngIf="!usuario" class="state state--warn">
        <h3>Acceso requerido</h3>
    </section>

    <section *ngIf="usuario" class="content">

        <div class="section-head">
            <div>
                <h2>Mis proyectos</h2>
                <p class="muted">Crea, edita y organiza tus proyectos.</p>
            </div>

            <a routerLink="/programador/nuevo-proyecto" class="btn btn--primary">
                <i class="bi bi-plus-lg" aria-hidden="true"></i>
                Nuevo proyecto
            </a>
        </div>

        <div *ngIf="!cargando && proyectos.length > 0" class="table-wrap">
            <table class="table">
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Rol</th>
                        <th>Tecnologías</th>
                        <th class="th-actions">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let p of proyectos">
                        <td>{{ p.titulo }}</td>
                        <td>
                            <span class="pill">{{ p.tipoProyecto }}</span>
                        </td>
                        <td>{{ p.tipoParticipacion }}</td>
                        <td>{{ p.tecnologias }}</td>
                        <td class="cell cell--actions">
                            <a [routerLink]="['/programador/editar-proyecto', p.id]" class="btn btn--ghost">
                                <i class="bi bi-pencil-square"></i>
                                Editar
                            </a>

                            <button type="button" class="btn btn--danger" (click)="eliminarProyecto(p)">
                                <i class="bi bi-trash3"></i>
                                Eliminar
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div *ngIf="!cargando && proyectos.length === 0" class="state state--empty">
            <p>No tienes proyectos aún.</p>
        </div>

    </section>
</div>
