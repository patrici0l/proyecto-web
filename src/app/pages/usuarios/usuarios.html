<h2 class="page-title">
  <i class="fa-solid fa-code" aria-hidden="true"></i>
  Explorar portafolios
</h2>

<!-- Loading -->
<div *ngIf="cargando" class="estado estado--cargando" aria-live="polite">
  <i class="fa-solid fa-spinner fa-spin" aria-hidden="true"></i>
  <span>Cargando programadores...</span>
</div>

<!-- Empty -->
<div *ngIf="!cargando && programadores.length === 0" class="estado estado--vacio">
  <i class="fa-solid fa-circle-exclamation" aria-hidden="true"></i>
  <span>No hay programadores registrados aún.</span>
</div>

<!-- Grid -->
<section class="grid" *ngIf="!cargando && programadores.length > 0" aria-label="Listado de programadores">
  <article class="card" *ngFor="let p of programadores">

    <!-- Banner + Avatar -->
    <header class="card__media" aria-hidden="true">
      <div class="banner"></div>

      <div class="avatar" [class.avatar--placeholder]="!p.foto">
        <img *ngIf="p.foto" [src]="p.foto" [alt]="'Foto de ' + p.nombre" loading="lazy" />
        <span *ngIf="!p.foto" class="avatar__fallback">
          <i class="fa-solid fa-user" aria-hidden="true"></i>
        </span>
      </div>
    </header>

    <!-- Content -->
    <div class="card__content">

      <h3 class="name">{{ p.nombre }}</h3>

      <div class="meta">
        <span class="badge badge--especialidad" *ngIf="p.especialidad">
          <i class="fa-solid fa-laptop-code" aria-hidden="true"></i>
          {{ p.especialidad }}
        </span>

        <span class="badge badge--disponible" *ngIf="p.disponibilidad">
          <i class="fa-solid fa-clock" aria-hidden="true"></i>
          {{ p.disponibilidad }}
        </span>
      </div>

      <p class="descripcion" *ngIf="p.descripcion">{{ p.descripcion }}</p>

      <nav class="links" aria-label="Redes del programador">
        <a *ngIf="p.github" [href]="p.github" target="_blank" rel="noopener">
          <i class="fa-brands fa-github" aria-hidden="true"></i>
          GitHub
        </a>

        <a *ngIf="p.linkedin" [href]="p.linkedin" target="_blank" rel="noopener">
          <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
          LinkedIn
        </a>
      </nav>

      <footer class="acciones">
        <button type="button" class="btn btn--ghost" [routerLink]="['/portafolio', p.id]">
          <i class="fa-solid fa-folder-open" aria-hidden="true"></i>
          Ver portafolio
        </button>

        <button type="button" class="btn btn--primary" [routerLink]="['/asesoria', p.id]">
          <i class="fa-solid fa-calendar-check" aria-hidden="true"></i>
          Agendar asesoría
        </button>
      </footer>

    </div>
  </article>
</section>
