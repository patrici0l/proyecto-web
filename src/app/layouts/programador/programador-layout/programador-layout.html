<div class="layout">

    <header>
        <h2><i class="bi bi-code-slash"></i> Panel del Programador</h2>

        <nav>
            <a routerLink="/programador" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">
                <i class="bi bi-house-door"></i> Inicio
            </a>

            <a routerLink="/programador/proyectos" routerLinkActive="activo">
                <i class="bi bi-folder2-open"></i> Mis proyectos
            </a>

            <a routerLink="/programador/asesorias" routerLinkActive="activo">
                <i class="bi bi-chat-left-text"></i> Mis asesorías
            </a>
            <a routerLink="/programador/dashboard" routerLinkActive="activo">
                <i class="bi bi-speedometer2"></i> Dashboard
            </a>
            <a routerLink="/usuarios" routerLinkActive="activo">
                <i class="bi bi-people"></i> Explorar portafolios
            </a>
            <app-theme-toggle></app-theme-toggle>
            <button type="button" (click)="logout()">
                <i class="bi bi-box-arrow-right"></i> Salir
            </button>
        </nav>
    </header>

    <main>
        <router-outlet></router-outlet>
    </main>
    <app-notificacion></app-notificacion>

</div>
